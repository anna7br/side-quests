/* ============================================================
   Stechen-Schreiber — Design tokens
   Light = Papier auf Filz, Dark = Filztisch bei Wirtshauslicht
   ============================================================ */
:root{
  color-scheme: light;
  --plane:#e9e7dd;
  --plane-2:#dedbcf;
  --surface:#fbfaf8;
  --surface-2:#f4f2ea;
  --sunken:#e6e4d9;
  --ink:#171a14;
  --ink-2:#54584c;
  --muted:#87897b;
  --line:#dedcd0;
  --hair:rgba(23,26,20,.10);
  --accent:#0e6b45;
  --accent-2:#0a5336;
  --accent-ink:#ffffff;
  --accent-soft:#e0edE5;
  --accent-line:#b8d6c5;
  --good:#0a7a34;
  --warn:#8a5a00;
  --crit:#b0302f;
  --crit-soft:#fbeceb;
  --shadow-1:0 1px 1px rgba(23,26,20,.05);
  --shadow-2:0 1px 2px rgba(23,26,20,.06), 0 10px 26px -14px rgba(23,26,20,.28);
  --shadow-3:0 2px 4px rgba(23,26,20,.08), 0 20px 44px -18px rgba(23,26,20,.34);
  --felt-a:#1d5b3f; --felt-b:#14432f;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --r-sm:6px; --r-md:10px; --r-lg:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0e1512;
    --plane-2:#0a100d;
    --surface:#182420;
    --surface-2:#1f2d28;
    --sunken:#131d19;
    --ink:#f1f3ec;
    --ink-2:#bdc5b9;
    --muted:#8b9a90;
    --line:#2a3a33;
    --hair:rgba(241,243,236,.13);
    --accent:#4dbe89;
    --accent-2:#7ad3a8;
    --accent-ink:#06130c;
    --accent-soft:#1c3129;
    --accent-line:#2f5644;
    --good:#0ca30c;
    --warn:#fab219;
    --crit:#e06b6a;
    --crit-soft:#33201f;
    --shadow-1:0 1px 1px rgba(0,0,0,.3);
    --shadow-2:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
    --shadow-3:0 2px 4px rgba(0,0,0,.45), 0 20px 44px -18px rgba(0,0,0,.8);
    --felt-a:#1a4d38; --felt-b:#0d2b1f;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0e1512;
  --plane-2:#0a100d;
  --surface:#182420;
  --surface-2:#1f2d28;
  --sunken:#131d19;
  --ink:#f1f3ec;
  --ink-2:#bdc5b9;
  --muted:#8b9a90;
  --line:#2a3a33;
  --hair:rgba(241,243,236,.13);
  --accent:#4dbe89;
  --accent-2:#7ad3a8;
  --accent-ink:#06130c;
  --accent-soft:#1c3129;
  --accent-line:#2f5644;
  --good:#0ca30c;
  --warn:#fab219;
  --crit:#e06b6a;
  --crit-soft:#33201f;
  --shadow-1:0 1px 1px rgba(0,0,0,.3);
  --shadow-2:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
  --shadow-3:0 2px 4px rgba(0,0,0,.45), 0 20px 44px -18px rgba(0,0,0,.8);
  --felt-a:#1a4d38; --felt-b:#0d2b1f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--plane);
  color:var(--ink);
  font-family:"Karla","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
h1,h2,h3{
  font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  font-weight:700;
  letter-spacing:-.02em;
  text-wrap:balance;
  margin:0;
}
.mono,.num{font-family:"Spline Sans Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}

/* felt backdrop ------------------------------------------------ */
.felt{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(120% 80% at 50% -10%, color-mix(in srgb,var(--plane) 82%, #fff 18%), transparent 60%),
  var(--plane);}

/* shell -------------------------------------------------------- */
.shell{max-width:1180px;margin:0 auto;padding:0 14px 120px}
.layout{display:grid;gap:22px;align-items:start}
@media (min-width:980px){
  .shell{padding:0 24px 60px}
  .layout{grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:28px}
}

/* topbar ------------------------------------------------------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb, var(--plane) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--hair);
  margin:0 -14px 18px;padding:8px 14px 10px;
}
@media (min-width:980px){.topbar{margin:0 -24px 22px;padding:10px 24px 12px}}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .pips{font-size:13px;letter-spacing:.06em;color:var(--accent);flex:none}
.brand h1{font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sep{flex:1}
.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-width:40px;height:40px;padding:0 10px;flex:none;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  cursor:pointer;font-size:13px;font-weight:600;box-shadow:var(--shadow-1);
}
.iconbtn:hover:not(:disabled){border-color:var(--accent-line);color:var(--accent)}
.iconbtn:disabled{opacity:.4;cursor:not-allowed}
.iconbtn svg{width:18px;height:18px;flex:none}
.iconbtn.labeled{padding:0 13px;gap:7px}

/* round meter = das Kartenprofil (Berg) ------------------------ */
.meter{display:flex;align-items:center;gap:12px}
.meter-fig{flex:1;min-width:0}
.profile{display:flex;align-items:flex-end;gap:2px;height:34px;border-bottom:1px solid var(--hair);padding-bottom:0}
.profile .bar{
  flex:1 1 0;min-width:2px;border-radius:3px 3px 0 0;position:relative;
  background:color-mix(in srgb, var(--ink) 14%, transparent);transition:background .18s;
}
.profile .bar.done{background:color-mix(in srgb, var(--accent) 45%, transparent)}
.profile .bar.now{background:var(--accent)}
.profile .bar.now::after{
  content:"";position:absolute;left:50%;translate:-50% 0;top:-7px;
  width:5px;height:5px;border-radius:50%;background:var(--accent);
}
.profile .bar.peak{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--ink) 25%, transparent)}
.meter-read{flex:none;text-align:right;line-height:1.15}
.meter-read b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:15px;display:block}
.meter-read span{font-size:11.5px;color:var(--muted);letter-spacing:.02em}

/* tabs (mobile) ------------------------------------------------ */
.tabs{display:flex;gap:4px;background:var(--sunken);padding:4px;border-radius:var(--r-md);margin-bottom:18px}
.tabs button{
  flex:1;min-height:38px;border:0;background:transparent;border-radius:7px;
  font-size:14px;font-weight:600;cursor:pointer;color:var(--ink-2);
}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
@media (min-width:980px){.tabs{display:none}}
@media (max-width:979px){.panel:not(.is-active){display:none}}
.rail{display:grid;gap:22px}

/* blocks ------------------------------------------------------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-2)}
.block{display:grid;gap:14px}

.eyebrow{

}
h2.title{font-size:clamp(20px,5vw,25px)}
h3.title{font-size:17px}
.lede{color:var(--ink-2);font-size:14.5px;max-width:60ch;margin:0}
.hr{height:1px;background:var(--hair);border:0;margin:0}

/* phase card --------------------------------------------------- */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-3);overflow:hidden}
.stage-head{padding:16px 16px 14px;display:grid;gap:6px;border-bottom:1px solid var(--hair);background:linear-gradient(var(--surface-2),var(--surface))}

.pill{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  padding:3px 9px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-2);
}
.pill.strong{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-2)}
.pill.bad{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 35%,transparent);color:var(--crit)}
.pill .dot{width:9px;height:9px;border-radius:50%;flex:none}

/* player entry row -------------------------------------------- */
.entry{display:grid;gap:8px;padding:10px;border-radius:var(--r-md);border:1px solid transparent}
.entry+.entry{border-top:1px solid var(--hair);border-radius:var(--r-md)}
.entry.turn{background:var(--accent-soft);border-color:var(--accent-line)}
.entry.done{opacity:.92}
.entry-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.seat{
  font-family:"Spline Sans Mono",monospace;font-size:11px;color:var(--muted);
  width:18px;flex:none;text-align:right;
}
.pdot{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:0 0 0 2px var(--surface)}
.pname{font-weight:700;font-size:16px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-top .sep{flex:1}
.tag{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.num-btn{
  position:relative;
  min-height:44px;border:1px solid var(--line);background:var(--surface-2);
  border-radius:9px;cursor:pointer;font-family:"Spline Sans Mono",monospace;
  font-size:16px;font-weight:500;transition:transform .1s, background .12s, border-color .12s;
}
/* Die angesagte Zahl: zart grün plus Unterstrich, damit die Markierung nicht
   allein an der Farbe hängt. Steht bewusst VOR :hover/[aria-pressed]/:disabled,
   die alle gleich spezifisch sind und daher als Spätere gewinnen sollen. */
.num-btn.bid{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-2);font-weight:600}
.num-btn.bid::after{
  content:"";position:absolute;left:50%;bottom:5px;translate:-50% 0;
  width:12px;height:2px;border-radius:1px;background:currentColor;opacity:.55;
}
.num-btn:hover:not(:disabled){border-color:var(--accent-line);background:var(--surface)}
.num-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.num-btn:disabled{
  opacity:.5;cursor:not-allowed;text-decoration:line-through;
  color:var(--muted);background:transparent;border-style:dashed;
}
.num-btn.forbidden{opacity:.5;cursor:not-allowed;border-style:dashed;border-color:var(--crit);color:var(--crit);text-decoration:line-through}
@media (prefers-reduced-motion: no-preference){.num-btn:active:not(:disabled){transform:scale(.94)}}
.autohint{font-size:11.5px;color:var(--accent-2);font-weight:600}

/* action bar --------------------------------------------------- */
.actionbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb,var(--plane) 92%, transparent);
  backdrop-filter:blur(12px);border-top:1px solid var(--hair);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
}
.actionbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.status{flex:1;min-width:0;font-size:13.5px;color:var(--ink-2);line-height:1.3}
.status b{color:var(--ink)}
.status.bad{color:var(--crit)}
.btn{
  min-height:50px;padding:0 20px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);font-weight:700;font-size:15.5px;cursor:pointer;
  box-shadow:var(--shadow-1);flex:none;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-2)}
.btn.primary:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--line)}
@media (min-width:980px){
  .actionbar{position:sticky;bottom:0;margin:0;border-radius:0}
}
/* Am Handy: Statuszeile oben über die ganze Breite, darunter Zurück + Hauptaktion. */
@media (max-width:979px){
  .actionbar-in{flex-wrap:wrap;gap:8px 10px}
  .actionbar-in .status{flex:1 1 100%;order:-1}
  .actionbar-in .btn{flex:1 1 auto;padding:0 14px}
  .actionbar-in .btn.undo-bar{flex:0 1 auto}
}

/* standings ---------------------------------------------------- */
.stand{display:grid;gap:2px}
.srow{display:grid;grid-template-columns:26px 13px minmax(0,1fr) auto;align-items:center;gap:9px;padding:8px 4px;border-bottom:1px solid var(--hair)}
.srow:last-child{border-bottom:0}
.srank{font-family:"Spline Sans Mono",monospace;font-size:13px;color:var(--muted);text-align:right}
.srow.lead .srank{color:var(--accent);font-weight:600}
.sname{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spts{font-family:"Spline Sans Mono",monospace;font-weight:600;font-size:16px;text-align:right}
.sgap{font-size:11.5px;color:var(--muted);font-family:"Spline Sans Mono",monospace}

/* table -------------------------------------------------------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
table.grid th,table.grid td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--hair);white-space:nowrap}
table.grid thead th{
  position:sticky;top:0;background:var(--surface-2);z-index:1;
  font-size:11.5px;font-weight:700;letter-spacing:.01em;border-bottom:1px solid var(--line);
}

  text-align:left;position:sticky;left:0;background:var(--surface);z-index:2;
  font-family:"Spline Sans Mono",monospace;font-size:11.5px;color:var(--muted);
  border-right:1px solid var(--hair);
}
table.grid thead th.rh{background:var(--surface-2);z-index:3}
table.grid td .cellpts{font-family:"Spline Sans Mono",monospace;font-weight:600;font-size:14px;display:block;line-height:1.15}
table.grid td .cellbid{font-size:10.5px;color:var(--muted);font-family:"Spline Sans Mono",monospace}
table.grid td.hit{background:var(--accent-soft)}
table.grid td.hit .cellbid{color:var(--accent-2)}
table.grid tfoot td{font-family:"Spline Sans Mono",monospace;font-weight:700;font-size:15px;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:0}
table.grid tfoot td.rh{background:var(--surface-2)}
.thead-dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:baseline}

/* chart -------------------------------------------------------- */
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto}
.gridline{stroke:var(--hair);stroke-width:1}

.serieline{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.crossline{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3}
.tip{
  position:absolute;z-index:5;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  box-shadow:var(--shadow-3);padding:8px 10px;font-size:12.5px;min-width:132px;
}
.tip.on{opacity:1}
.tip h4{margin:0 0 5px;font-size:11px;font-family:"Spline Sans Mono",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.tip .tr{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:7px;align-items:center;padding:1.5px 0}
.tip .tr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tip .tr b{font-family:"Spline Sans Mono",monospace;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:4px}
.legend .li{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);font-weight:600}
.legend .li i{width:10px;height:10px;border-radius:3px;flex:none}

/* setup -------------------------------------------------------- */
.hero{padding:26px 4px 22px;display:grid;gap:14px}
.hero .kicker{display:flex;align-items:center;gap:9px;color:var(--accent);font-family:"Spline Sans Mono",monospace;font-size:11.5px;text-transform:uppercase;letter-spacing:.13em;font-weight:500}
.hero h1{font-size:clamp(34px,10vw,60px);line-height:.95;letter-spacing:-.035em;font-weight:800}
.hero p{margin:0;font-size:clamp(16px,4vw,18.5px);color:var(--ink-2);max-width:44ch}
.hero p em{font-style:italic;color:var(--ink)}
.field{display:grid;gap:8px}
.field>label{font-size:13.5px;font-weight:700;letter-spacing:-.005em}
.field .help{font-size:12.5px;color:var(--muted);margin:0}
.optrow{display:flex;flex-wrap:wrap;gap:7px}
.opt{
  min-height:42px;padding:0 13px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface-2);cursor:pointer;font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;
}
.opt small{font-weight:400;color:var(--muted);font-size:12px}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[aria-pressed="true"] small{color:color-mix(in srgb,var(--accent-ink) 75%,transparent)}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.stepper button{width:40px;height:38px;border:0;background:transparent;border-radius:7px;cursor:pointer;font-size:20px;line-height:1;font-weight:600;color:var(--ink-2)}
.stepper button:hover:not(:disabled){background:var(--surface);color:var(--accent)}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper .val{min-width:52px;text-align:center;font-family:"Spline Sans Mono",monospace;font-size:16px;font-weight:600}
.plist{display:grid;gap:7px}
.pinput{display:grid;grid-template-columns:13px minmax(0,1fr) 38px 38px;gap:7px;align-items:center}
.pinput input{
  min-height:46px;padding:0 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit;font-weight:600;width:100%;
}
.pinput input::placeholder{color:var(--muted);font-weight:400}
.pinput .mini{
  width:38px;height:38px;border:1px solid var(--line);background:var(--surface-2);
  border-radius:9px;cursor:pointer;color:var(--ink-2);font-size:15px;display:grid;place-items:center;
}
.pinput .mini:hover:not(:disabled){color:var(--accent);border-color:var(--accent-line)}
.pinput .mini:disabled{opacity:.3;cursor:not-allowed}
.note{
  display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--r-md);
  background:var(--accent-soft);border:1px solid var(--accent-line);font-size:13.5px;color:var(--accent-2);
}
.note.plain{background:var(--surface-2);border-color:var(--line);color:var(--ink-2)}
.note b{color:inherit}
.note .x{margin-left:auto;background:none;border:0;cursor:pointer;color:inherit;opacity:.6;font-size:16px;line-height:1;padding:2px 4px}

/* review + end ------------------------------------------------- */
.deltas{display:grid;gap:6px}
.drow{display:grid;grid-template-columns:13px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 10px;border-radius:var(--r-md);background:var(--surface-2)}
.drow.hit{background:var(--accent-soft)}
.drow .dn{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .db{font-size:12px;color:var(--muted);font-family:"Spline Sans Mono",monospace}
.drow.hit .db{color:var(--accent-2)}
.drow .dp{font-family:"Spline Sans Mono",monospace;font-weight:700;font-size:16px}
.winner{display:grid;gap:10px;padding:22px 18px;border-radius:var(--r-lg);background:linear-gradient(160deg,var(--accent-soft),var(--surface));border:1px solid var(--accent-line);text-align:center}
.winner .crown{font-size:30px;line-height:1}
.winner .wn{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(28px,8vw,42px);font-weight:800;letter-spacing:-.03em;line-height:1}
.winner .wp{font-family:"Spline Sans Mono",monospace;font-size:15px;color:var(--accent-2);font-weight:600}
.awards{display:grid;gap:10px}
@media (min-width:560px){.awards{grid-template-columns:1fr 1fr}}
.award{display:grid;gap:3px;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface)}
.award .at{font-family:"Spline Sans Mono",monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
.award .aw{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
.award .ad{font-size:12.5px;color:var(--ink-2)}
.btnrow{display:flex;flex-wrap:wrap;gap:9px}

/* dialog ------------------------------------------------------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(8,14,11,.5);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-3);max-width:440px;width:100%;padding:20px;display:grid;gap:14px}
.modal textarea{
  width:100%;min-height:170px;font-family:"Spline Sans Mono",monospace;font-size:12.5px;
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);
  color:var(--ink);padding:11px;resize:vertical;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.footnote{font-size:12px;color:var(--muted);text-align:center;padding:8px 0 0;max-width:56ch;margin:0 auto}

/* ============================================================
   Sichtbarkeit je Bildschirmbreite — bewusst am Ende und mit zwei
   Klassen, damit kein späteres display: aus .btn/.iconbtn gewinnt.
   Zurück sitzt dort, wo Hand bzw. Maus eh liegt: am Handy unten in
   der Aktionsleiste, am Desktop oben im Kopf.
   ============================================================ */
@media (max-width:979px){
  .iconbtn.undo-head{display:none}
  .btn.hide-narrow{display:none}
}
@media (min-width:980px){
  .btn.undo-bar{display:none}
}
</style>
</head>
<body>
<div class="felt"></div>
<div class="shell">
  <div id="top"></div>
  <div id="root"></div>
  <p class="footnote" id="foot"></p>
</div>
<div id="bar"></div>
<div id="dlg"></div>

<script>
"use strict";

/* ============================================================
   Persistenz
   ============================================================ */
const K_STATE="stechen.v2.state", K_UNDO="stechen.v2.undo", K_THEME="stechen.v2.theme";
const ls={
  get(k,f){ try{const v=localStorage.getItem(k); return v==null?f:JSON.parse(v);}catch(e){return f;} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} },
  del(k){ try{localStorage.removeItem(k);}catch(e){} }
};

/* Theme ------------------------------------------------------- */
(function(){ const t=ls.get(K_THEME,null); if(t==="dark"||t==="light") document.documentElement.dataset.theme=t; })();
function cycleTheme(){
  const cur=document.documentElement.dataset.theme||"system";
  const next=cur==="system"?"dark":cur==="dark"?"light":"system";
  if(next==="system"){ delete document.documentElement.dataset.theme; ls.del(K_THEME); }
  else { document.documentElement.dataset.theme=next; ls.set(K_THEME,next); }
  render();
}

/* ============================================================
   Spielzustand
   ============================================================ */
const DECKS=[
  {n:52,label:"52 Blatt",sub:"französisch"},
  {n:36,label:"36 Blatt",sub:"ab Sechser"},
  {n:32,label:"32 Blatt",sub:"Schnapskarten"},
  {n:55,label:"55 Blatt",sub:"mit Jokern"}
];
const DEFAULT_NAMES=["Anna","Bius","Cilli","Dorli","Erika"];

/* Zurück-Pfeil: kräftiger Strich, geschlossene Spitze — bei 17px noch erkennbar. */
const UNDO_SVG=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h9.5a5.5 5.5 0 1 1 0 11H7"/><path d="M8.4 5.4 3.4 10l5 4.6"/></svg>`;
const undoBarBtn = () =>
  `<button class="btn ghost undo-bar" data-act="undo" ${undoStack.length?"":"disabled"}>${UNDO_SVG}Zurück</button>`;

let S=null;              // laufendes Spiel oder null
let setup=null;          // Setup-Formular
let undoStack=ls.get(K_UNDO,[]);
let tab="spiel";
let toast=null;

function makeSetup(prev){
  return {
    deck: prev?prev.deck:52,
    trickValue: prev?prev.trickValue:1,
    bonus: prev?prev.bonus:10,
    names: prev?prev.names.slice():DEFAULT_NAMES.slice(),
    advanced:false,
    err:null
  };
}

function startGame(cfg){
  const names=cfg.names.map(s=>s.trim()).filter(Boolean);
  const n=names.length;
  const maxCards=Math.max(1,Math.floor(cfg.deck/n));
  S={
    v:2, deck:cfg.deck, trickValue:cfg.trickValue, bonus:cfg.bonus,
    names, maxCards, rounds:2*maxCards-1,
    dealer0: Math.floor(Math.random()*n),
    round:1, phase:"bid",
    bids:Array(n).fill(null), tricks:Array(n).fill(null), autoIdx:[],
    done:[],                       // {cards,bids,tricks,pts:[]}
    finished:false, greeted:true
  };
  undoStack=[]; ls.del(K_UNDO);
  tab="spiel"; save(); render(); window.scrollTo({top:0});
}

function save(){ if(S) ls.set(K_STATE,S); else ls.del(K_STATE); }
function snapshot(){
  if(!S) return;
  undoStack.push(JSON.stringify(S));
  if(undoStack.length>40) undoStack.shift();
  ls.set(K_UNDO,undoStack);
}
function undo(){
  if(!undoStack.length) return;
  S=JSON.parse(undoStack.pop());
  ls.set(K_UNDO,undoStack); save();
  if(!S.finished && tab==="verlauf") tab="spiel";
  render();
}

/* Regel-Helfer ------------------------------------------------- */
const N = ()=>S.names.length;
const cardsIn = r => r<=S.maxCards ? r : 2*S.maxCards-r;
const dealerOf = r => (S.dealer0+r-1)%N();
const orderOf  = r => Array.from({length:N()},(_,k)=>(S.dealer0+r+k)%N());
const peakRound = ()=>S.maxCards;
const isHalftime = r => r===S.maxCards-1 && S.maxCards>=3;

function roundPoints(bids,tricks){
  return bids.map((b,i)=>(b===tricks[i]?S.bonus:0)+tricks[i]*S.trickValue);
}
function totals(uptoIdx){
  const upto = uptoIdx==null ? S.done.length : uptoIdx;
  const t=Array(N()).fill(0);
  for(let r=0;r<upto;r++) for(let i=0;i<N();i++) t[i]+=S.done[r].pts[i];
  return t;
}
function cumSeries(){
  const rows=[];const acc=Array(N()).fill(0);
  S.done.forEach(d=>{ for(let i=0;i<N();i++) acc[i]+=d.pts[i]; rows.push(acc.slice()); });
  return rows;
}
function ranking(t){
  const idx=t.map((p,i)=>i).sort((a,b)=>t[b]-t[a]||S.names[a].localeCompare(S.names[b]));
  const ranks={};let last=null,lr=0;
  idx.forEach((i,pos)=>{ if(t[i]!==last){lr=pos+1;last=t[i];} ranks[i]=lr; });
  return {idx,ranks};
}
function forbiddenBid(){
  const d=dealerOf(S.round), c=cardsIn(S.round);
  let sum=0;
  for(let i=0;i<N();i++){ if(i===d) continue; if(S.bids[i]==null) return null; sum+=S.bids[i]; }
  const f=c-sum;
  return (f>=0&&f<=c)?f:null;
}
const sumOf = a => a.reduce((x,v)=>x+(v||0),0);
const filled = a => a.every(v=>v!=null);

/* Wie viele Stiche kann Spieler:in i höchstens haben, ohne die Kartenzahl
   zu sprengen? Der eigene Wert zählt nicht mit — sonst könnte man die
   eigene Auswahl nicht mehr abwählen. */
function trickCap(i){
  let s=0;
  for(let k=0;k<N();k++) if(k!==i && S.tricks[k]!=null) s+=S.tricks[k];
  return cardsIn(S.round)-s;
}

function bidsOK(){
  if(!filled(S.bids)) return false;
  const f=forbiddenBid();
  return !(f!=null && S.bids[dealerOf(S.round)]===f);
}
function tricksOK(){ return filled(S.tricks) && sumOf(S.tricks)===cardsIn(S.round); }

/* Aktionen ---------------------------------------------------- */
function setBid(i,v){
  snapshot();
  S.bids[i]=(S.bids[i]===v?null:v);
  save(); render();
}
/* Automatisch ergänzte Felder. Älter gespeicherte Spiele haben hier
   noch eine einzelne Zahl statt einer Liste. */
function autoList(){
  if(Array.isArray(S.autoIdx)) return S.autoIdx;
  return S.autoIdx==null?[]:[S.autoIdx];
}
function setTrick(i,v){
  snapshot();
  S.autoIdx=autoList().filter(x=>x!==i);   // Antippen macht das Feld zur Handeingabe
  S.tricks[i]=(S.tricks[i]===v?null:v);
  reAuto(); save(); render();
}
/* Was sich aus den übrigen Eingaben zwingend ergibt, tragen wir selber ein:
   das letzte offene Feld, und alle offenen Felder wenn die Stiche schon
   vergeben sind — dort ist Null der einzige mögliche Wert. */
function reAuto(){
  const c=cardsIn(S.round);
  autoList().forEach(i=>{ S.tricks[i]=null; });
  S.autoIdx=[];
  const open=[];
  S.tricks.forEach((v,i)=>{ if(v==null) open.push(i); });
  if(!open.length) return;
  const rest=c-sumOf(S.tricks);
  if(rest<0) return;
  if(open.length===1){ S.tricks[open[0]]=rest; S.autoIdx=[open[0]]; }
  else if(rest===0){ open.forEach(i=>{ S.tricks[i]=0; }); S.autoIdx=open.slice(); }
}
function commitBids(){
  if(!bidsOK()) return;
  snapshot(); S.phase="tricks"; S.tricks=Array(N()).fill(null); S.autoIdx=[];
  save(); render(); window.scrollTo({top:0,behavior:"smooth"});
}
function commitTricks(){
  if(!tricksOK()) return;
  snapshot();
  S.done.push({cards:cardsIn(S.round),bids:S.bids.slice(),tricks:S.tricks.slice(),pts:roundPoints(S.bids,S.tricks)});
  S.phase="review"; save(); render(); window.scrollTo({top:0,behavior:"smooth"});
}
function nextRound(){
  snapshot();
  if(S.round>=S.rounds){ S.finished=true; tab="verlauf"; }
  else { S.round++; S.phase="bid"; S.bids=Array(N()).fill(null); S.tricks=Array(N()).fill(null); S.autoIdx=[]; }
  save(); render(); window.scrollTo({top:0});
}
function repeatRound(){
  snapshot();
  S.done.pop(); S.phase="bid";
  S.tricks=Array(N()).fill(null); S.autoIdx=[];
  save(); render(); window.scrollTo({top:0});
}
function backToBids(){ snapshot(); S.phase="bid"; S.tricks=Array(N()).fill(null); S.autoIdx=[]; save(); render(); }

/* ============================================================
   Utils
   ============================================================ */
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const col = i => "var(--s"+((i%8)+1)+")";
const plural=(n,a,b)=>n===1?a:b;
const sign = v => (v>0?"+":"")+v;

/* ============================================================
   Render
   ============================================================ */
function render(){
  const top=document.getElementById("top"), root=document.getElementById("root"), bar=document.getElementById("bar");
  if(!S){ top.innerHTML=""; bar.innerHTML=""; renderSetup(root); document.getElementById("foot").textContent=""; wire(); return; }
  top.innerHTML=topbar();
  root.innerHTML=`<div class="layout">
      ${tabsHTML()}
      <div class="panel ${tab==="spiel"?"is-active":""}" data-panel="spiel">${S.finished?endPanel():stagePanel()}</div>
      <div class="rail">
        <div class="panel ${tab==="tabelle"?"is-active":""}" data-panel="tabelle">${standingsBlock()}${tableBlock()}</div>
        <div class="panel ${tab==="verlauf"?"is-active":""}" data-panel="verlauf">${chartBlock()}</div>
      </div>
    </div>`;
  bar.innerHTML=actionBar();
  document.getElementById("foot").innerHTML = S.finished ? "" :
    `Alles wird lokal in diesem Browser gespeichert — Seite zumachen und später weiterspielen ist kein Problem.`;
  mountChart();
  wire();
}

function topbar(){
  const th=document.documentElement.dataset.theme||"system";
  const ico = th==="dark"
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>`
    : th==="light"
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.8" y="4.5" width="18.4" height="15" rx="2.5"/><path d="M12 4.5v15"/></svg>`;
  const thLabel = th==="dark"?"Dunkel":th==="light"?"Hell":"System";

  let meter="";
  if(!S.finished){
    const bars=[];
    for(let r=1;r<=S.rounds;r++){
      const c=cardsIn(r);
      const cls=r<S.round?"done":r===S.round?"now":"";
      bars.push(`<div class="bar ${cls} ${r===peakRound()?"peak":""}" style="height:${Math.max(8,(c/S.maxCards)*100)}%"></div>`);
    }
    meter=`<div class="meter">
      <div class="meter-fig">
        <div class="profile" role="img" aria-label="Runde ${S.round} von ${S.rounds}, ${cardsIn(S.round)} Karten. Gipfel bei Runde ${peakRound()} mit ${S.maxCards} Karten.">${bars.join("")}</div>
      </div>
      <div class="meter-read">
        <b class="mono">${S.round}/${S.rounds}</b>
        <span>${cardsIn(S.round)} ${plural(cardsIn(S.round),"Karte","Karten")}</span>
      </div>
    </div>`;
  } else {
    meter=`<div class="meter"><div class="meter-fig"><div class="profile" aria-hidden="true">${
      Array.from({length:S.rounds},(_,k)=>`<div class="bar done" style="height:${Math.max(8,(cardsIn(k+1)/S.maxCards)*100)}%"></div>`).join("")
    }</div></div><div class="meter-read"><b class="mono">${S.rounds}/${S.rounds}</b><span>ausgspielt</span></div></div>`;
  }

  return `<div class="topbar"><div class="topbar-in">
    <div class="brand">
      <span class="pips" aria-hidden="true">♠&#8202;♥&#8202;♦&#8202;♣</span>
      <h1>Stechen-Schreiber</h1>
      <span class="sep"></span>
      <button class="iconbtn labeled undo-head" data-act="undo" ${undoStack.length?"":"disabled"} title="Letzte Eingabe zurücknehmen">
        ${UNDO_SVG}Zurück
      </button>
      <button class="iconbtn" data-act="theme" title="Farbschema: ${thLabel}" aria-label="Farbschema wechseln (aktuell ${thLabel})">${ico}</button>
      <button class="iconbtn" data-act="quit" title="Spiel beenden" aria-label="Spiel beenden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    ${meter}
  </div></div>`;
}

function tabsHTML(){
  const t=[["spiel",S.finished?"Auswertung":"Runde"],["tabelle","Stand"],["verlauf","Verlauf"]];
  return `<div class="tabs" role="tablist">${t.map(([k,l])=>
    `<button role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}</button>`).join("")}</div>`;
}

/* --- Spielphasen --------------------------------------------- */
function stagePanel(){
  const r=S.round, c=cardsIn(r), d=dealerOf(r), ord=orderOf(r);
  const t=totals();
  let head, body;

  if(S.phase==="review"){
    const last=S.done[S.done.length-1];
    const pts=last.pts;
    const {idx,ranks}=ranking(t);
    const half=isHalftime(r);
    head=`<div class="stage-head">
      <div class="row"><span class="eyebrow">Runde ${r} abgerechnet</span></div>
      <h2>${half?"Gipfel-Zwischenstand!":r>=S.rounds?"Letzte Runde gspielt":"Zwischenstand"}</h2>
      ${half?`<p class="lede">Direkt vor der größten Runde mit ${S.maxCards} Karten — Zeit für einen Blick auf die Punkteentwicklung.</p>`
            :`<p class="lede">${last.bids.filter((b,i)=>b===last.tricks[i]).length} von ${N()} haben punktgenau angsagt.</p>`}
    </div>`;
    body=`<div class="stage-body">
      <div class="deltas">${idx.map(i=>{
        const hit=last.bids[i]===last.tricks[i];
        return `<div class="drow ${hit?"hit":""}">
          <span class="pdot" style="background:${col(i)}"></span>
          <span><span class="dn">${esc(S.names[i])}</span><br><span class="db">angsagt ${last.bids[i]} · gmacht ${last.tricks[i]}${hit?" · punktgenau +"+S.bonus:""}</span></span>
          <span class="dp">${sign(pts[i])}</span>
          <span class="pill">${t[i]} Pkt · ${ranks[i]}.</span>
        </div>`;}).join("")}
      </div>
      ${half?`<div class="hr"></div>${chartSVGHost("halfchart")}`:""}
      <div class="btnrow">
        <button class="btn ghost" data-act="repeat">Runde nochmal spielen</button>
      </div>
    </div>`;
    return `<div class="stage">${head}${body}</div>`;
  }

  const isBid = S.phase==="bid";
  const forb = isBid?forbiddenBid():null;
  head=`<div class="stage-head">
    <div class="row">
      <span class="eyebrow">Runde ${r} von ${S.rounds}</span>
      <span class="pill strong">${c} ${plural(c,"Karte","Karten")}</span>
      ${r===peakRound()?`<span class="pill">Gipfel</span>`:""}
    </div>
    <h2>${isBid?"Wer sagt wie viel an?":"Wer hat wie viel gstochen?"}</h2>
    <div class="row">
      <span class="pill"><span class="pdot" style="background:${col(d)}"></span>${esc(S.names[d])} teilt aus</span>
      <span class="pill"><span class="pdot" style="background:${col(ord[0])}"></span>${esc(S.names[ord[0]])} spielt aus</span>
    </div>
    ${isBid
      ? `<p class="lede">Angsagt wird im Uhrzeigersinn, wer austeilt, kommt zuletzt dran — und <b>deaf ned</b> auf ${c} auffüllen.</p>`
      : `<p class="lede">Es san <b>${sumOf(S.bids)}</b> ${plural(sumOf(S.bids),"Stich","Stiche")} angsagt bei ${c} möglichen. ${sumOf(S.bids)>c?"Übersagt — da geht si was aus!":sumOf(S.bids)<c?"Da bleibt was liegen.":""} Die grün umrandete Zahl war die Ansage.</p>`}
  </div>`;

  const firstOpen = ord.find(i=>(isBid?S.bids:S.tricks)[i]==null);
  body=`<div class="stage-body">${ord.map((i,k)=>{
    const val=(isBid?S.bids:S.tricks)[i];
    const isDealer=i===d;
    const auto=!isBid&&autoList().includes(i);
    const cap=isBid?c:trickCap(i);
    return `<div class="entry ${i===firstOpen?"turn":""} ${val!=null?"done":""}">
      <div class="entry-top">
        <span class="seat mono">${k+1}.</span>
        <span class="pdot" style="background:${col(i)}"></span>
        <span class="pname">${esc(S.names[i])}</span>
        ${isDealer?`<span class="tag">Geber:in</span>`:k===0?`<span class="tag">Ausspieler:in</span>`:""}
        <span class="sep"></span>
        ${auto?`<span class="autohint" title="Ergibt sich zwingend aus den übrigen Eingaben">ergänzt</span>`:""}
        ${isBid&&isDealer&&forb!=null?`<span class="pill bad">${forb} deafst ned</span>`:""}
      </div>
      <div class="nums" role="group" aria-label="${isBid?`Ansage von ${esc(S.names[i])}`:`Stiche von ${esc(S.names[i])}, angsagt ${S.bids[i]}`}">
        ${Array.from({length:c+1},(_,v)=>{
          const bad=isBid&&isDealer&&forb!=null&&v===forb;
          const impossible=!isBid&&v>cap;
          const wasBid=!isBid&&S.bids[i]===v;
          const attrs = bad ? 'aria-disabled="true" title="Wer austeilt, deaf ned genau auffüllen"'
                     : impossible ? `disabled title="Es san nur noch ${Math.max(0,cap)} von ${c} ${plural(c,"Stich","Stichen")} offen"`
                     : wasBid ? 'title="Das war die Ansage"'
                     : "";
          return `<button class="num-btn ${bad?"forbidden":""} ${wasBid?"bid":""}" data-set="${isBid?"bid":"trick"}" data-i="${i}" data-v="${v}"
            aria-pressed="${val===v}" ${attrs}>${v}</button>`;
        }).join("")}
      </div>
    </div>`;}).join("")}
    ${!isBid?`<div class="btnrow"><button class="btn ghost" data-act="backbids">Ansagen korrigieren</button></div>`:""}
  </div>`;
  return `<div class="stage">${head}${body}</div>`;
}

function actionBar(){
  if(S.finished){
    return `<div class="actionbar"><div class="actionbar-in">
      <div class="status">Spiel fertig — ${esc(S.names[ranking(totals()).idx[0]])} führt die Liste an.</div>
      ${undoBarBtn()}
      <button class="btn hide-narrow" data-act="copy">Ergebnis kopieren</button>
      <button class="btn primary" data-act="rematch">Revanche</button>
    </div></div>`;
  }
  const c=cardsIn(S.round);
  let status="", label="", act="", ok=true;
  if(S.phase==="bid"){
    const open=S.bids.filter(v=>v==null).length;
    const f=forbiddenBid(), d=dealerOf(S.round);
    if(open>0){ status=`Noch <b>${open}</b> ${plural(open,"Ansage","Ansagen")} offen.`; ok=false; }
    else if(f!=null&&S.bids[d]===f){ status=`<b>${esc(S.names[d])}</b> deaf ned auf ${c} auffüllen — andere Zahl wählen.`; ok=false; }
    else { const s=sumOf(S.bids); status=`Es san <b>${s}</b> ${plural(s,"Stich","Stiche")} angsagt. Haut's rein!`; }
    label="Stiche eintragen"; act="commitBids";
  } else if(S.phase==="tricks"){
    const s=sumOf(S.tricks), open=S.tricks.filter(v=>v==null).length;
    if(s>c){ status=`Upsalalala — <b>${s}</b> Stiche bei nur ${c} möglichen.`; ok=false; }
    else if(open>0&&s<c){ status=`Noch <b>${c-s}</b> von ${c} ${plural(c,"Stich","Stichen")} zu verteilen.`; ok=false; }
    else if(open>0){ status=`Bei <b>${open}</b> ${plural(open,"Spieler:in fehlt","Spieler:innen fehlt")} noch die Eingabe.`; ok=false; }
    else if(s<c){ status=`Es fehlen <b>${c-s}</b> ${plural(c-s,"Stich","Stiche")}.`; ok=false; }
    else status=`Passt: ${c} von ${c} ${plural(c,"Stich","Stichen")} verteilt.`;
    label="Runde abrechnen"; act="commitTricks";
  } else {
    const t=totals(), {idx}=ranking(t);
    status=`<b>${esc(S.names[idx[0]])}</b> führt mit ${t[idx[0]]} Punkten.`;
    label=S.round>=S.rounds?"Zur Auswertung":"Nächste Runde"; act="next";
  }
  return `<div class="actionbar"><div class="actionbar-in">
    <div class="status ${ok?"":"bad"}" aria-live="polite">${status}</div>
    ${undoBarBtn()}
    <button class="btn primary" data-act="${act}" ${ok?"":"disabled"}>${label}</button>
  </div></div>`;
}

/* --- Stand ---------------------------------------------------- */
function standingsBlock(){
  const t=totals(), {idx,ranks}=ranking(t), top=t[idx[0]]||0;
  const hits=Array(N()).fill(0);
  S.done.forEach(d=>d.bids.forEach((b,i)=>{ if(b===d.tricks[i]) hits[i]++; }));
  return `<div class="block" style="margin-bottom:22px">
    <div class="block-head"><h3 class="title">Stand</h3><span class="eyebrow">nach ${S.done.length} von ${S.rounds} Runden</span></div>
    <div class="card" style="padding:6px 12px">
      <div class="stand">${idx.map(i=>`
        <div class="srow ${ranks[i]===1?"lead":""}">
          <span class="srank">${ranks[i]}.</span>
          <span class="pdot" style="background:${col(i)}"></span>
          <span><span class="sname">${esc(S.names[i])}</span><br><span class="sgap">${hits[i]}× punktgenau</span></span>
          <span><span class="spts">${t[i]}</span><br><span class="sgap">${t[i]===top&&ranks[i]===1?"führt":sign(t[i]-top)}</span></span>
        </div>`).join("")}
      </div>
    </div>
  </div>`;
}

function tableBlock(){
  if(!S.done.length){
    return `<div class="block">
      <div class="block-head"><h3 class="title">Tabelle</h3></div>
      <div class="note plain">Sobald die erste Runde abgerechnet ist, steht hier jede Ansage und jeder Stich — Runde für Runde.</div>
    </div>`;
  }
  const t=totals();
  const rows=S.done.map((d,r)=>`<tr>
    <td class="rh">R${r+1}<span style="opacity:.6"> · ${d.cards}K</span></td>
    ${d.bids.map((b,i)=>{
      const hit=b===d.tricks[i];
      return `<td class="${hit?"hit":""}"><span class="cellpts">${d.pts[i]}</span><span class="cellbid">${b}/${d.tricks[i]}${hit?" ✓":""}</span></td>`;
    }).join("")}
  </tr>`).join("");
  return `<div class="block">
    <div class="block-head"><h3 class="title">Tabelle</h3><span class="eyebrow">Punkte · angsagt/gmacht</span></div>
    <div class="tblwrap">
      <table class="grid">
        <thead><tr><th class="rh">Runde</th>${S.names.map((nm,i)=>
          `<th><span class="thead-dot" style="background:${col(i)}"></span>${esc(nm)}</th>`).join("")}</tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td class="rh">Summe</td>${t.map(v=>`<td>${v}</td>`).join("")}</tr></tfoot>
      </table>
    </div>
  </div>`;
}

  </div>
  <div class="legend">${S.names.map((nm,i)=>

}
function chartBlock(){
  if(S.done.length<1){
    return `<div class="block">
      <div class="block-head"><h3 class="title">Punkteverlauf</h3></div>
      <div class="note plain">Die Kurve wächst mit jeder abgerechneten Runde.</div>
    </div>`;
  }
  return `<div class="block">
    <div class="block-head"><h3 class="title">Punkteverlauf</h3><span class="eyebrow">kumulierte Punkte je Runde</span></div>
    ${chartSVGHost("mainchart")}
  </div>`;

function niceTicks(min,max,want){
  if(max<=min) max=min+1;
  const raw=(max-min)/want, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||10*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step;
  const out=[]; for(let v=lo;v<=hi+1e-9;v+=step) out.push(Math.round(v*1000)/1000);
  return out;
}

function mountChart(){
  document.querySelectorAll("[data-chart]").forEach(host=>drawChart(host));
}

function drawChart(host){
  const series=cumSeries();
  if(!series.length) return;
  const R=series.length, n=N();
  const W=Math.max(260,host.clientWidth||300);
  const H=Math.min(340,Math.max(210,Math.round(W*0.62)));
  const labelling = n<=4;
  const padL=38, padR=labelling?104:14, padT=14, padB=28;
  const iw=Math.max(40,W-padL-padR), ih=H-padT-padB;

  let lo=0, hi=0;
  series.forEach(row=>row.forEach(v=>{ if(v<lo)lo=v; if(v>hi)hi=v; }));
  const ticks=niceTicks(lo,hi,4);
  const yMin=ticks[0], yMax=ticks[ticks.length-1];
  const X = r => R===1 ? padL+iw/2 : padL+(r/(R-1))*iw;
  const Y = v => padT+ih-((v-yMin)/(yMax-yMin||1))*ih;

  const every = R>16?Math.ceil(R/8):R>9?2:1;
  let g="";
  ticks.forEach(v=>{
    g+=`<line class="gridline" x1="${padL}" y1="${Y(v).toFixed(1)}" x2="${padL+iw}" y2="${Y(v).toFixed(1)}"/>`;
    g+=`<text class="axistext" x="${padL-7}" y="${(Y(v)+3.6).toFixed(1)}" text-anchor="end">${v}</text>`;
  });
  g+=`<line class="axisline" x1="${padL}" y1="${padT+ih}" x2="${padL+iw}" y2="${padT+ih}"/>`;
  for(let r=0;r<R;r++){
    if(r%every!==0 && r!==R-1) continue;
    g+=`<text class="axistext" x="${X(r).toFixed(1)}" y="${padT+ih+16}" text-anchor="middle">${r+1}</text>`;
  }

  let marks="";
  for(let i=0;i<n;i++){
    const pts=series.map((row,r)=>`${X(r).toFixed(1)},${Y(row[i]).toFixed(1)}`).join(" ");
    if(R>1) marks+=`<polyline class="serieline" points="${pts}" style="stroke:${col(i)}"/>`;
    if(R<=18) series.forEach((row,r)=>{
      marks+=`<circle cx="${X(r).toFixed(1)}" cy="${Y(row[i]).toFixed(1)}" r="4" fill="${col(i)}" stroke="var(--surface)" stroke-width="2"/>`;
    });
    else marks+=`<circle cx="${X(R-1).toFixed(1)}" cy="${Y(series[R-1][i]).toFixed(1)}" r="4.5" fill="${col(i)}" stroke="var(--surface)" stroke-width="2"/>`;
  }

  let labels="";
  if(labelling){
    const last=series[R-1];
    const arr=last.map((v,i)=>({i,y:Y(v),v})).sort((a,b)=>a.y-b.y);
    for(let k=1;k<arr.length;k++) if(arr[k].y-arr[k-1].y<15) arr[k].y=arr[k-1].y+15;
    const over=arr.length?arr[arr.length-1].y-(padT+ih):0;
    if(over>0) arr.forEach(a=>a.y-=over);
    arr.forEach(a=>{
      const x=X(R-1)+11;
      labels+=`<circle cx="${(x+4).toFixed(1)}" cy="${a.y.toFixed(1)}" r="4" fill="${col(a.i)}"/>`;
      const nm=S.names[a.i].length>7?S.names[a.i].slice(0,7)+"…":S.names[a.i];
      labels+=`<text class="dlabel" x="${(x+13).toFixed(1)}" y="${(a.y+4).toFixed(1)}">${esc(nm)} <tspan style="fill:var(--muted)">${a.v}</tspan></text>`;
    });
  }

  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
      aria-label="Punkteverlauf über ${R} ${plural(R,"Runde","Runden")}. Die Zahlen stehen auch in der Tabelle.">
    <g>${g}</g><g>${marks}</g><g id="cross"></g><g>${labels}</g>
    <rect x="${padL-6}" y="${padT}" width="${iw+12}" height="${ih}" fill="transparent" data-hit="1" style="cursor:crosshair"/>
  </svg><div class="tip" data-tip></div>`;

  const svg=host.querySelector("svg"), hit=host.querySelector("[data-hit]");
  const cross=host.querySelector("#cross"), tip=host.querySelector("[data-tip]");
  const move=ev=>{
    const box=svg.getBoundingClientRect();
    const px=(ev.clientX-box.left)*(W/box.width);
    let r=R===1?0:Math.round(((px-padL)/iw)*(R-1));
    r=Math.max(0,Math.min(R-1,r));
    const row=series[r];
    cross.innerHTML=`<line class="crossline" x1="${X(r).toFixed(1)}" y1="${padT}" x2="${X(r).toFixed(1)}" y2="${padT+ih}"/>`+
      row.map((v,i)=>`<circle cx="${X(r).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="6" fill="${col(i)}" stroke="var(--surface)" stroke-width="2"/>`).join("");
    const ord=row.map((v,i)=>({i,v})).sort((a,b)=>b.v-a.v);
    tip.innerHTML=`<h4>Runde ${r+1} · ${S.done[r].cards} ${plural(S.done[r].cards,"Karte","Karten")}</h4>`+
      ord.map(o=>`<div class="tr"><i class="pdot" style="background:${col(o.i)};width:9px;height:9px;border-radius:2px;box-shadow:none"></i><span>${esc(S.names[o.i])}</span><b>${o.v}</b></div>`).join("");
    tip.classList.add("on");
    const tw=tip.offsetWidth||140, sx=(X(r)/W)*box.width;
    tip.style.left=Math.max(2,Math.min(box.width-tw-2,sx-tw/2))+"px";
    tip.style.top="6px";
  };
  const leave=()=>{ cross.innerHTML=""; tip.classList.remove("on"); };
  hit.addEventListener("pointermove",move);
  hit.addEventListener("pointerdown",move);
  hit.addEventListener("pointerleave",leave);
  hit.addEventListener("pointercancel",leave);
}

/* --- Auswertung ---------------------------------------------- */
function endPanel(){
  const t=totals(), {idx,ranks}=ranking(t);
  const n=N();
  const st=Array(n).fill(0), bd=Array(n).fill(0), nul=Array(n).fill(0), hit=Array(n).fill(0);
  S.done.forEach(d=>d.bids.forEach((b,i)=>{
    bd[i]+=b; st[i]+=d.tricks[i];
    if(b===0) nul[i]++;
    if(b===d.tricks[i]) hit[i]++;
  }));
  const best=(arr,dir)=>{
    let bi=0; for(let i=1;i<n;i++) if(dir>0?arr[i]>arr[bi]:arr[i]<arr[bi]) bi=i;
    const tie=arr.filter(v=>v===arr[bi]).length>1;
    return {i:bi,v:arr[bi],tie};
  };
  const A=[
    ["Stichkaiser:in","hat am meisten gstochen",best(st,1),v=>`${v} Stiche`],
    ["Hasardeur:in","hat am meisten angsagt",best(bd,1),v=>`${v} angsagt`],
    ["Hellseher:in","war am öftesten punktgenau",best(hit,1),v=>`${v}× exakt`],
    ["Feigling","hat am öftesten Null angsagt",best(nul,1),v=>`${v}× Null`]
  ];
  const w=idx[0];
  const maxRound=(()=>{
    let bi=0,br=0,bv=-1e9;
    S.done.forEach((d,r)=>d.pts.forEach((p,i)=>{ if(p>bv){bv=p;bi=i;br=r;} }));
    return {i:bi,r:br+1,v:bv,cards:S.done[br].cards};
  })();

  return `<div class="block">
    <div class="winner">
      <div class="crown" aria-hidden="true">♛</div>
      <span class="eyebrow">Das Spiel is vorbei — oh là là!</span>
      <div class="wn">${esc(S.names[w])}</div>
      <div class="wp">${t[w]} Punkte · ${hit[w]}× punktgenau · ${st[w]} Stiche</div>
    </div>

    <div class="block-head" style="margin-top:8px"><h3 class="title">Endstand</h3><span class="eyebrow">${S.rounds} Runden · ${S.trickValue} pro Stich · ${S.bonus} für punktgenau</span></div>
    <div class="card" style="padding:6px 12px"><div class="stand">${idx.map(i=>`
      <div class="srow ${ranks[i]===1?"lead":""}">
        <span class="srank">${ranks[i]}.</span>
        <span class="pdot" style="background:${col(i)}"></span>
        <span><span class="sname">${esc(S.names[i])}</span><br><span class="sgap">${st[i]} Stiche · ${bd[i]} angsagt · ${hit[i]}× exakt</span></span>
        <span><span class="spts">${t[i]}</span><br><span class="sgap">${i===w?"gwonnen":sign(t[i]-t[w])}</span></span>
      </div>`).join("")}</div></div>

    <div class="block-head" style="margin-top:8px"><h3 class="title">Ehrentitel</h3></div>
    <div class="awards">${A.map(([title,sub,b,fmt])=>`
      <div class="award">
        <span class="at">${title}</span>
        <span class="aw"><span class="pdot" style="background:${col(b.i)}"></span>${esc(S.names[b.i])}${b.tie?` <span class="tag">geteilt</span>`:""}</span>
        <span class="ad">${sub} — ${fmt(b.v)}</span>
      </div>`).join("")}
      <div class="award">
        <span class="at">Beste Einzelrunde</span>
        <span class="aw"><span class="pdot" style="background:${col(maxRound.i)}"></span>${esc(S.names[maxRound.i])}</span>
        <span class="ad">${maxRound.v} Punkte in Runde ${maxRound.r} mit ${maxRound.cards} ${plural(maxRound.cards,"Karte","Karten")}</span>
      </div>
    </div>

    <div class="hr" style="margin:6px 0"></div>
    ${chartBlockInner()}
    <div class="hr" style="margin:6px 0"></div>
    ${tableBlock()}
    <div class="btnrow" style="margin-top:6px">
      <button class="btn ghost" data-act="copy">Ergebnis kopieren</button>
      <button class="btn ghost" data-act="fresh">Neues Spiel aufsetzen</button>
    </div>
  </div>`;
}
function chartBlockInner(){
  return `<div class="block"><div class="block-head"><h3 class="title">Punkteverlauf</h3><span class="eyebrow">kumulierte Punkte je Runde</span></div>${chartSVGHost("endchart")}</div>`;
}

/* ============================================================
   Setup
   ============================================================ */
function renderSetup(root){
  if(!setup) setup=makeSetup();
  const names=setup.names;
  const valid=names.map(s=>s.trim()).filter(Boolean);
  const n=valid.length;
  const maxCards=n?Math.max(1,Math.floor(setup.deck/n)):0;
  const rounds=n?2*maxCards-1:0;
  const rs=ls.get(K_STATE,null);
  const resume=(rs&&rs.v===2&&Array.isArray(rs.names)&&rs.names.length>=2)?rs:null;

  const profile=n?Array.from({length:rounds},(_,k)=>{
    const c=k+1<=maxCards?k+1:2*maxCards-(k+1);
    return `<div class="bar done" style="height:${Math.max(8,(c/maxCards)*100)}%"></div>`;
  }).join(""):"";

  root.innerHTML=`
  <div class="hero">
    <div class="kicker"><span aria-hidden="true">♠&#8202;♥&#8202;♦&#8202;♣</span> Der Schreibblock für's Kartenspiel</div>
    <h1>Stechen-<br>Schreiber</h1>
    <p>Spü ma Stechen! Du sagst an, <em>des Programm schreibt</em> — Punkte, Zwischenstand, Kurve und am Ende die Ehrentitel.</p>
  </div>

  ${resume?`<div class="note" style="margin-bottom:18px">
    <span>Es liegt noch ein Spiel mit <b>${esc(resume.names.join(", "))}</b> herum — Runde ${resume.round} von ${resume.rounds}.</span>
    <button class="btn primary" style="min-height:40px;padding:0 14px;font-size:14px;margin-left:auto" data-act="resume">Weiterspielen</button>
  </div>`:""}

  <div class="layout">
    <div class="card" style="padding:18px;display:grid;gap:20px">
      <div class="field">
        <label>Wer spielt mit?</label>
        <p class="help">In der Sitzreihenfolge im Uhrzeigersinn — die Reihenfolge entscheidet, wer wann ansagt.</p>
        <div class="plist">${names.map((v,i)=>`
          <div class="pinput">
            <span class="pdot" style="background:${col(i)}"></span>
            <!-- Sichtbar steht die Doppelpunkt-Form; das aria-label kommt ohne
                 Doppelpunkt aus, den manche Screenreader mitsprechen. -->
            <input type="text" value="${esc(v)}" data-name="${i}" placeholder="Spieler:in ${i+1}" maxlength="14"
                   autocomplete="off" spellcheck="false" enterkeyhint="next" aria-label="Name der ${i+1}. Person">
            <button class="mini" data-act="pup" data-i="${i}" ${i===0?"disabled":""}
                    aria-label="${esc(v.trim()||"Person "+(i+1))} nach vorn" title="nach vorn">↑</button>
            <button class="mini" data-act="pdel" data-i="${i}" ${names.length<=2?"disabled":""}
                    aria-label="${esc(v.trim()||"Person "+(i+1))} entfernen" title="entfernen">✕</button>
          </div>`).join("")}
        </div>
        <div class="btnrow">
          <button class="opt" data-act="padd" ${names.length>=8?"disabled":""}>+ Spieler:in</button>
          ${names.length>=8?`<span class="tag" style="align-self:center">8 ist das Maximum</span>`:""}
        </div>
      </div>

      <div class="hr"></div>

      <div class="field">
        <label>Welches Blatt?</label>
        <div class="optrow">${DECKS.map(d=>`
          <button class="opt" data-act="deck" data-v="${d.n}" aria-pressed="${setup.deck===d.n}">
            ${d.label} <small>${d.sub}</small>
          </button>`).join("")}
        </div>
      </div>

      <div class="field">
        <label>Was ist ein Stich wert?</label>
        <div class="stepper">
          <button data-act="tv" data-v="-1" ${setup.trickValue<=1?"disabled":""} aria-label="weniger">−</button>
          <span class="val">${setup.trickValue}</span>
          <button data-act="tv" data-v="1" ${setup.trickValue>=20?"disabled":""} aria-label="mehr">+</button>
        </div>
      </div>

      <div class="field">
        <label>Bonus für punktgenaue Ansage</label>
        <p class="help">Im Original san's 10 Punkte, wenn Ansage und Stiche zusammenpassen.</p>
        <div class="stepper">
          <button data-act="bn" data-v="-1" ${setup.bonus<=0?"disabled":""} aria-label="weniger">−</button>
          <span class="val">${setup.bonus}</span>
          <button data-act="bn" data-v="1" ${setup.bonus>=50?"disabled":""} aria-label="mehr">+</button>
        </div>
      </div>

      ${setup.err?`<div class="note" style="background:var(--crit-soft);border-color:var(--crit);color:var(--crit)">${esc(setup.err)}</div>`:""}
    </div>

    <div class="rail">
      <div class="block">
        <div class="block-head"><h3 class="title">So läuft's</h3></div>
        <div class="card" style="padding:16px;display:grid;gap:14px">
          ${n>=2?`
          <div>
            <div class="profile" style="height:44px" role="img" aria-label="${rounds} Runden, bis ${maxCards} Karten in der Gipfelrunde">${profile}</div>
            <p class="help" style="margin-top:7px">Karten pro Runde: aufi bis ${maxCards}, dann wieder obi.</p>
          </div>
          <div class="stand">
            <div class="srow"><span class="srank"></span><span></span><span class="sname">Spieler:innen</span><span class="spts">${n}</span></div>
            <div class="srow"><span class="srank"></span><span></span><span class="sname">Runden</span><span class="spts">${rounds}</span></div>
            <div class="srow"><span class="srank"></span><span></span><span class="sname">Größte Runde</span><span class="spts">${maxCards}</span></div>
            <div class="srow"><span class="srank"></span><span></span><span class="sname">Karten im Deck</span><span class="spts">${setup.deck}</span></div>
          </div>
          ${rounds>30?`<div class="note plain">${rounds} Runden san a ordentliche Partie — plan a paar Stunden ein.</div>`:""}
          `:`<div class="note plain">Mindestens zwei Namen eintragen, dann rechnet's hier mit.</div>`}
          <div class="hr"></div>
          <p class="help" style="margin:0">
            Punkte je Runde: <b>${setup.trickValue}</b> pro gemachtem Stich, plus <b>${setup.bonus}</b> wenn die Ansage exakt aufgeht.
            Wer austeilt, sagt zuletzt an und deaf die Summe <b>ned</b> auf die Kartenzahl auffüllen.
          </p>
        </div>
      </div>
    </div>
  </div>

  <div class="actionbar" id="setupbar"><div class="actionbar-in">
    <div class="status">${n>=2?`<b>${n}</b> Spieler:innen · ${rounds} Runden · bis ${maxCards} Karten`:"Noch mindestens einen Namen brauchen wir."}</div>
    <button class="btn primary" data-act="start" ${n>=2?"":"disabled"}>Los, austeilen!</button>
  </div></div>`;
  document.getElementById("bar").innerHTML="";
}

/* ============================================================
   Events
   ============================================================ */
function wire(){
  document.querySelectorAll("input[data-name]").forEach(inp=>{
    inp.addEventListener("input",e=>{
      setup.names[+e.target.dataset.name]=e.target.value;
      updateSetupLive();
    });
    inp.addEventListener("keydown",e=>{
      if(e.key!=="Enter") return;
      const i=+e.target.dataset.name;
      const next=document.querySelector(`input[data-name="${i+1}"]`);
      if(next) next.focus();
      else if(setup.names.map(s=>s.trim()).filter(Boolean).length>=2) act("start");
    });
  });
}
function updateSetupLive(){
  const valid=setup.names.map(s=>s.trim()).filter(Boolean);
  const n=valid.length;
  const bar=document.querySelector("#setupbar .status");
  const btn=document.querySelector('#setupbar [data-act="start"]');
  if(!bar||!btn) return;
  if(n>=2){
    const mc=Math.max(1,Math.floor(setup.deck/n));
    bar.innerHTML=`<b>${n}</b> Spieler:innen · ${2*mc-1} Runden · bis ${mc} Karten`;
    btn.disabled=false;
  } else { bar.innerHTML="Noch mindestens einen Namen brauchen wir."; btn.disabled=true; }
}

function act(a,el){
  switch(a){
    case "theme": cycleTheme(); return;
    case "undo": undo(); return;
    case "quit": confirmQuit(); return;
    case "commitBids": commitBids(); return;
    case "commitTricks": commitTricks(); return;
    case "next": nextRound(); return;
    case "repeat": repeatRound(); return;
    case "backbids": backToBids(); return;
    case "copy": copyResult(); return;
    case "rematch": { const names=S.names.slice(), cfg={deck:S.deck,trickValue:S.trickValue,bonus:S.bonus,names}; startGame(cfg); return; }
    case "fresh": { setup=makeSetup({deck:S.deck,trickValue:S.trickValue,bonus:S.bonus,names:S.names.slice()}); S=null; save(); undoStack=[]; ls.del(K_UNDO); render(); window.scrollTo({top:0}); return; }
    case "resume": {
      const r=ls.get(K_STATE,null);
      if(r&&r.v===2&&Array.isArray(r.names)){ S=r; tab=S.finished?"verlauf":"spiel"; render(); window.scrollTo({top:0}); }
      return;
    }
    case "deck": setup.deck=+el.dataset.v; renderSetup(document.getElementById("root")); wire(); return;
    case "tv": setup.trickValue=Math.min(20,Math.max(1,setup.trickValue+ +el.dataset.v)); renderSetup(document.getElementById("root")); wire(); return;
    case "bn": setup.bonus=Math.min(50,Math.max(0,setup.bonus+ +el.dataset.v)); renderSetup(document.getElementById("root")); wire(); return;
    case "padd": if(setup.names.length<8){ setup.names.push(""); renderSetup(document.getElementById("root")); wire();
                   const inp=document.querySelector(`input[data-name="${setup.names.length-1}"]`); if(inp) inp.focus(); } return;
    case "pdel": if(setup.names.length>2){ setup.names.splice(+el.dataset.i,1); renderSetup(document.getElementById("root")); wire(); } return;
    case "pup": { const i=+el.dataset.i; if(i>0){ const a2=setup.names; [a2[i-1],a2[i]]=[a2[i],a2[i-1]]; renderSetup(document.getElementById("root")); wire(); } return; }
    case "start": {
      const names=setup.names.map(s=>s.trim()).filter(Boolean);
      if(names.length<2){ setup.err="Zu zweit geht's los — mindestens zwei Namen."; renderSetup(document.getElementById("root")); wire(); return; }
      const low=names.map(s=>s.toLowerCase());
      if(new Set(low).size!==low.length){ setup.err="Zwei gleiche Namen gehen ned — sonst weiß niemand, wer gmeint is."; renderSetup(document.getElementById("root")); wire(); return; }
      setup.err=null;
      startGame({deck:setup.deck,trickValue:setup.trickValue,bonus:setup.bonus,names});
      const d=S.names[dealerOf(1)];
      showModal(`<h2 class="title" style="font-size:22px">Der heilige Zufall hat gsprochen</h2>
        <p class="lede"><b>${esc(d)}</b> teilt als Erste:r aus — Gratulation!</p>
        <p class="lede">Angsagt wird links davon, also fängt <b>${esc(S.names[orderOf(1)[0]])}</b> an.</p>
        <div class="btnrow" style="justify-content:flex-end"><button class="btn primary" data-act="closemodal">Auf geht's</button></div>`);
      return;
    }
    case "closemodal": document.getElementById("dlg").innerHTML=""; return;
    case "reallyquit": {
      S=null; save(); undoStack=[]; ls.del(K_UNDO);
      document.getElementById("dlg").innerHTML=""; setup=setup||makeSetup(); render(); window.scrollTo({top:0}); return;
    }
  }
}

function confirmQuit(){
  showModal(`<h2 class="title" style="font-size:21px">Spiel wirklich beenden?</h2>
    <p class="lede">Der aktuelle Stand nach ${S.done.length} ${plural(S.done.length,"Runde","Runden")} geht dabei verloren.</p>
    <div class="btnrow" style="justify-content:flex-end">
      <button class="btn ghost" data-act="closemodal">Weiterspielen</button>
      <button class="btn" style="background:var(--crit);border-color:var(--crit);color:#fff" data-act="reallyquit">Beenden</button>
    </div>`);
}
function showModal(html){
  document.getElementById("dlg").innerHTML=`<div class="scrim" data-scrim="1"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const b=document.querySelector(".modal .btn.primary")||document.querySelector(".modal .btn");
  if(b) b.focus();
}

function resultText(){
  const t=totals(), {idx,ranks}=ranking(t);
  let s=`Stechen — ${S.done.length} von ${S.rounds} Runden\n`;
  s+=`${S.names.length} Spieler:innen, ${S.deck} Blatt, ${S.trickValue} pro Stich, ${S.bonus} für punktgenau\n\n`;
  idx.forEach(i=>{ s+=`${ranks[i]}. ${S.names[i]} — ${t[i]} Punkte\n`; });
  s+=`\nRunde | ${S.names.join(" | ")}\n`;
  S.done.forEach((d,r)=>{
    s+=`R${r+1} (${d.cards}K) | ${d.pts.map((p,i)=>`${p} [${d.bids[i]}/${d.tricks[i]}]`).join(" | ")}\n`;
  });
  return s;
}
async function copyResult(){
  const txt=resultText();
  try{
    await navigator.clipboard.writeText(txt);
    showModal(`<h2 class="title" style="font-size:21px">Kopiert</h2>
      <p class="lede">Der Endstand liegt in der Zwischenablage — einfach in den Gruppenchat einfügen.</p>
      <div class="btnrow" style="justify-content:flex-end"><button class="btn primary" data-act="closemodal">Passt</button></div>`);
  }catch(e){
    showModal(`<h2 class="title" style="font-size:21px">Ergebnis zum Mitnehmen</h2>
      <p class="lede">Kopieren hat der Browser ned erlaubt — hier zum Markieren:</p>
      <textarea readonly>${esc(txt)}</textarea>
      <div class="btnrow" style="justify-content:flex-end"><button class="btn primary" data-act="closemodal">Zu</button></div>`);
    const ta=document.querySelector(".modal textarea"); if(ta){ ta.focus(); ta.select(); }
  }
}

/* Delegation --------------------------------------------------- */
document.addEventListener("click",e=>{
  const set=e.target.closest("[data-set]");
  if(set){
    if(set.classList.contains("forbidden")||set.disabled) return;
    const i=+set.dataset.i, v=+set.dataset.v;
    if(set.dataset.set==="bid") setBid(i,v); else setTrick(i,v);
    return;
  }
  const tb=e.target.closest("[data-tab]");
  if(tb){ tab=tb.dataset.tab; render(); return; }
  const a=e.target.closest("[data-act]");
  if(a){ if(a.disabled) return; act(a.dataset.act,a); return; }
  if(e.target.dataset.scrim) document.getElementById("dlg").innerHTML="";
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&document.getElementById("dlg").innerHTML){ document.getElementById("dlg").innerHTML=""; return; }
  if(e.key==="Enter"&&S&&!document.getElementById("dlg").innerHTML&&document.activeElement.tagName!=="INPUT"){
    const b=document.querySelector(".actionbar .btn.primary");
    if(b&&!b.disabled){ e.preventDefault(); act(b.dataset.act,b); }
  }
});
let rt;
window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(S) mountChart(); },160); });

/* Start -------------------------------------------------------- */
(function boot(){
  const saved=ls.get(K_STATE,null);
  if(saved&&saved.v===2&&Array.isArray(saved.names)){ S=saved; tab=S.finished?"verlauf":"spiel"; }
  else { setup=makeSetup(); }
  render();
})();
</script>
