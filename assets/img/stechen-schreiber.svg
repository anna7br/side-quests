<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Stechen-Schreiber: card suits and a score sheet on green felt">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d5b3f"/><stop offset="1" stop-color="#14432f"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#felt)"/>
  <g transform="rotate(-8 130 150)">
    <rect x="40" y="70" width="180" height="170" rx="12" fill="#fbfaf8" stroke="#dedcd0"/>
    <g font-family="'Courier New',monospace" font-size="13" fill="#54584c">
      <text x="56" y="100">R1 ·1K</text><text x="56" y="128">R2 ·2K</text><text x="56" y="156">R3 ·3K</text><text x="56" y="184">R4 ·4K</text><text x="56" y="212">R5 ·5K</text>
    </g>
    <g font-family="'Courier New',monospace" font-size="13" font-weight="700" fill="#171a14">
      <text x="128" y="100">11</text><text x="128" y="128">12</text><text x="128" y="156">0</text><text x="128" y="184">13</text><text x="128" y="212">2</text>
      <text x="168" y="100">0</text><text x="168" y="128">11</text><text x="168" y="156">13</text><text x="168" y="184">1</text><text x="168" y="212">14</text>
    </g>
    <rect x="120" y="86" width="30" height="18" rx="3" fill="#e0ede5"/><text x="128" y="100" font-family="'Courier New',monospace" font-size="13" font-weight="700" fill="#0a5336">11</text>
  </g>
  <g font-family="Georgia,serif" font-size="64" text-anchor="middle">
    <text x="275" y="118" fill="#171a14">♠</text><text x="335" y="118" fill="#b0302f">♥</text>
    <text x="275" y="190" fill="#b0302f">♦</text><text x="335" y="190" fill="#171a14">♣</text>
  </g>
  <rect x="236" y="56" width="134" height="150" rx="10" fill="none" stroke="#fbfaf8" stroke-opacity=".35"/>
  <text x="304" y="246" font-family="Arial,sans-serif" font-size="12" fill="#e0ede5" text-anchor="middle" letter-spacing="2">ANGSAGT · GMACHT</text>
